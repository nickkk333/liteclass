name: Build fnOS package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "构建完成后发布到的 tag（留空则只上传 artifact）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Linux Node runtime
        run: |
          mkdir -p fnos/.cache
          curl -fsSL "https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz" \
            -o "fnos/.cache/node-v24.20.0-linux-x64.tar.xz"

      - name: Build fpk
        run: node fnos/build.mjs

      - name: Show package
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: liteclass-fpk
          path: release/*.fpk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "轻课堂 $TAG" --notes "自动构建的 fnOS 安装包（$TAG）"
          gh release upload "$TAG" release/*.fpk --clobber
